---
- name: Install the AI runtime host packages # noqa package-latest
  ansible.builtin.apt:
    name: [bubblewrap, apparmor-profiles, apparmor-utils, earlyoom]
    state: latest
    update_cache: true
    cache_valid_time: 3600
  environment:
    NEEDRESTART_MODE: l

- name: Install the Ubuntu bubblewrap user namespace profile
  ansible.builtin.copy:
    src: /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
    dest: /etc/apparmor.d/bwrap-userns-restrict
    remote_src: true
    owner: root
    group: root
    mode: "0644"

- name: Load the bubblewrap user namespace profile
  ansible.builtin.command:
    argv: [apparmor_parser, -r, /etc/apparmor.d/bwrap-userns-restrict]
  changed_when: false

- name: Verify Codex user and network namespace prerequisites
  ansible.builtin.command:
    argv:
      - bwrap
      - --ro-bind
      - /
      - /
      - --dev-bind
      - /dev
      - /dev
      - --proc
      - /proc
      - --tmpfs
      - /tmp
      - --unshare-user
      - --unshare-net
      - --unshare-pid
      - --uid
      - "0"
      - --gid
      - "0"
      - --
      - /bin/true
  become_user: "{{ devbox_user }}"
  changed_when: false

- name: Read the development account uid
  ansible.builtin.command:
    argv: [id, -u, "{{ devbox_user }}"]
  register: base_devbox_uid
  changed_when: false

- name: Create the development user manager override directory
  ansible.builtin.file:
    path: "/etc/systemd/system/user@{{ base_devbox_uid.stdout }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Give development user services a neutral default OOM adjustment
  ansible.builtin.copy:
    dest: "/etc/systemd/system/user@{{ base_devbox_uid.stdout }}.service.d/50-dev-server-memory.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      # User managers add 100 to their own adjustment for child services.
      # A -100 manager gives workers the same zero default as login shells.
      OOMScoreAdjust=-100
  register: base_user_memory_policy

- name: Load the development user manager memory policy
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: base_user_memory_policy.changed

- name: Apply the neutral OOM default without restarting user workloads
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import os
        from pathlib import Path
        import subprocess
        import sys

        user, uid = sys.argv[1:]
        unit = f'user@{uid}.service'
        pid = subprocess.check_output(
            ['systemctl', 'show', unit, '-p', 'MainPID', '--value'],
            text=True).strip()
        if pid == '0':
            print('inactive; policy applies at next login')
            sys.exit(0)

        changed = False
        score = Path(f'/proc/{pid}/oom_score_adj')
        if score.read_text().strip() != '-100':
            score.write_text('-100')
            changed = True

        env = dict(os.environ, XDG_RUNTIME_DIR=f'/run/user/{uid}')
        control = ['runuser', '-u', user, '--', 'systemctl', '--user']
        def default_score():
            return subprocess.check_output(
                control + ['show', '-p', 'DefaultOOMScoreAdjust', '--value'],
                env=env, text=True).strip()
        if default_score() != '0':
            subprocess.run(control + ['daemon-reexec'], env=env, check=True)
            changed = True
        if default_score() != '0':
            raise SystemExit('user manager OOM default is not zero')

        # Repair the old inherited +200 in this user's managed service tree.
        # Leave login sessions and other per-process adjustments unchanged.
        cgroup = subprocess.check_output(
            ['systemctl', 'show', unit, '-p', 'ControlGroup', '--value'],
            text=True).strip()
        if not cgroup:
            raise SystemExit('user manager control group is unavailable')
        for proc in Path('/proc').glob('[0-9]*'):
            try:
                if not (proc / 'cgroup').read_text().startswith(f'0::{cgroup}/'):
                    continue
                score = proc / 'oom_score_adj'
                if score.read_text().strip() == '200':
                    score.write_text('0')
                    changed = True
            except (FileNotFoundError, ProcessLookupError):
                pass
        print('changed' if changed else 'current')
      - "{{ devbox_user }}"
      - "{{ base_devbox_uid.stdout }}"
  register: base_user_memory_activation
  changed_when: base_user_memory_activation.stdout == 'changed'

- name: Prefer preserving interactive agents during memory exhaustion
  ansible.builtin.copy:
    dest: /etc/default/earlyoom
    owner: root
    group: root
    mode: "0644"
    backup: true
    content: |
      # Preserve agent sessions and essential host processes; other victims are
      # ranked by memory use. This is a preference, not immunity from OOM.
      # tmux renames its server process to "tmux: server".
      EARLYOOM_ARGS="-r 60 -m 10 -s 20 --avoid '^(systemd|sshd|tailscaled|tmux(: server)?|init|caddy|dockerd|containerd|postgres|codex|claude)$'"

- name: Check whether earlyoom is running the installed policy
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        from pathlib import Path
        import shlex
        import subprocess

        config = Path('/etc/default/earlyoom').read_text()
        assignment = next(line for line in config.splitlines()
                          if line.startswith('EARLYOOM_ARGS='))
        expected = shlex.split(shlex.split(assignment)[0].split('=', 1)[1])
        pid = subprocess.check_output(
            ['systemctl', 'show', 'earlyoom.service', '-p', 'MainPID', '--value'],
            text=True).strip()
        try:
            actual = Path(f'/proc/{int(pid)}/cmdline').read_bytes().split(b'\0')
        except FileNotFoundError:
            actual = []
        print('current' if [arg.decode() for arg in actual[1:-1]] == expected
              else 'restart')
  register: base_earlyoom_policy
  changed_when: false

- name: Activate the memory exhaustion policy
  ansible.builtin.systemd_service:
    name: earlyoom.service
    enabled: true
    state: "{{ (base_earlyoom_policy.stdout == 'current') | ternary('started', 'restarted') }}"
