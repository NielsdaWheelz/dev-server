---
- name: Install apt keyring directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/apt/keyrings
    - /usr/share/keyrings

- name: Install declared repository keys
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - url: https://download.docker.com/linux/ubuntu/gpg
      dest: /etc/apt/keyrings/docker.asc
    - url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
      dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    - url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
      dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    - url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
      dest: /etc/apt/keyrings/nodesource.asc

- name: Resolve Ubuntu apt architecture
  ansible.builtin.set_fact:
    base_apt_architecture: >-
      {{ ansible_facts['architecture']
         | regex_replace('x86_64', 'amd64')
         | regex_replace('aarch64', 'arm64') }}

- name: Install declared apt repositories
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ item.content }}\n"
  loop:
    - dest: /etc/apt/sources.list.d/docker.list
      content: >-
        deb [arch={{ base_apt_architecture }}
        signed-by=/etc/apt/keyrings/docker.asc]
        https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
    - dest: /etc/apt/sources.list.d/github-cli.list
      content: >-
        deb [arch={{ base_apt_architecture }}
        signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg]
        https://cli.github.com/packages stable main
    - dest: /etc/apt/sources.list.d/tailscale.list
      content: >-
        deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
        https://pkgs.tailscale.com/stable/ubuntu {{ ansible_facts['distribution_release'] }} main
    - dest: /etc/apt/sources.list.d/nodesource.list
      content: >-
        deb [signed-by=/etc/apt/keyrings/nodesource.asc]
        https://deb.nodesource.com/node_{{ devbox_node_major }}.x nodistro main

- name: Install current declared package candidates # noqa package-latest
  ansible.builtin.apt:
    name:
      - bat
      - build-essential
      - ca-certificates
      - curl
      - dbus-user-session
      - direnv
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-ce-rootless-extras
      - docker-compose-plugin
      - eza
      - fd-find
      - fuse-overlayfs
      - fzf
      - gh
      - git
      - git-delta
      - gnupg
      - htop
      - jq
      - locales
      - mosh
      - ncdu
      - nodejs
      - python3
      - python3-apt
      - ripgrep
      - rsync
      - slirp4netns
      - tailscale
      - tmux
      - uidmap
      - ufw
      - unattended-upgrades
      - unzip
      - vim
      - zoxide
      - zsh
      - zsh-autosuggestions
      - zsh-syntax-highlighting
    state: latest
    update_cache: true
    cache_valid_time: 3600

- name: Read installed Docker package version after apply
  ansible.builtin.command:
    argv: [dpkg-query, -W, "-f=${Version}", docker-ce]
  register: base_docker_version_after
  changed_when: false

- name: Read installed tmux client version
  ansible.builtin.command: tmux -V
  register: base_tmux_client_version
  changed_when: false
  failed_when: >-
    base_tmux_client_version.rc != 0 or
    not (base_tmux_client_version.stdout is match('^tmux [!-~]{1,60}$'))

- name: Inspect active tmux server
  ansible.builtin.command: tmux list-sessions
  become: true
  become_user: "{{ devbox_user }}"
  register: base_tmux_sessions
  changed_when: false
  failed_when: false

- name: Read active tmux server version
  ansible.builtin.command:
    argv: [tmux, display-message, -p, "#{version}"]
  become: true
  become_user: "{{ devbox_user }}"
  register: base_tmux_server_version
  changed_when: false
  failed_when: false
  when: base_tmux_sessions.rc == 0

- name: Report deferred tmux binary activation
  ansible.builtin.debug:
    msg: DEV_SERVER_TMUX_DEFERRED
  when: >-
    base_tmux_sessions.rc not in [0, 1] or
    (base_tmux_sessions.rc == 0 and
      (base_tmux_server_version.rc != 0 or
       ('tmux ' ~ base_tmux_server_version.stdout) != base_tmux_client_version.stdout))

- name: Read current timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: base_current_timezone
  changed_when: false

- name: Configure timezone
  ansible.builtin.command: "timedatectl set-timezone {{ devbox_timezone }}"
  changed_when: true
  when: base_current_timezone.stdout != devbox_timezone

- name: Install exact generated locale set
  ansible.builtin.copy:
    dest: /etc/locale.gen
    owner: root
    group: root
    mode: "0644"
    content: "{{ devbox_locale }} UTF-8\n"
  notify: Generate locale

- name: Install system locale
  ansible.builtin.copy:
    dest: /etc/default/locale
    owner: root
    group: root
    mode: "0644"
    content: "LANG={{ devbox_locale }}\n"

- name: Install Ubuntu command aliases
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  loop:
    - src: /usr/bin/batcat
      dest: /usr/local/bin/bat
    - src: /usr/bin/fdfind
      dest: /usr/local/bin/fd

- name: Configure unattended package maintenance
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Ensure Tailscale is active
  ansible.builtin.systemd_service:
    name: tailscaled.service
    enabled: true
    state: started

- name: Ensure native apt maintenance timers are active
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Read devbox user id
  ansible.builtin.command: "id -u {{ devbox_user }}"
  register: base_user_uid
  changed_when: false

- name: Read user-service linger state
  ansible.builtin.command: "loginctl show-user {{ devbox_user }} -p Linger --value"
  register: base_user_linger
  changed_when: false

- name: Enable user services at boot
  ansible.builtin.command: "loginctl enable-linger {{ devbox_user }}"
  changed_when: true
  when: base_user_linger.stdout != "yes"

- name: Ensure the user service manager is active
  ansible.builtin.systemd_service:
    name: "user@{{ base_user_uid.stdout }}.service"
    state: started

- name: Wait for the user service bus
  ansible.builtin.wait_for:
    path: "/run/user/{{ base_user_uid.stdout }}/bus"
    state: present
    timeout: 30

- name: Ensure user directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "/home/{{ devbox_user }}"
      mode: "0750"
    - path: "/home/{{ devbox_user }}/src/work"
      mode: "0755"
    - path: "/home/{{ devbox_user }}/src/personal"
      mode: "0755"
    - path: "/home/{{ devbox_user }}/.ai-images"
      mode: "0755"
    - path: "/home/{{ devbox_user }}/bin"
      mode: "0755"
    - path: "/home/{{ devbox_user }}/.local"
      mode: "0755"
    - path: "/home/{{ devbox_user }}/.local/bin"
      mode: "0755"
    - path: "/home/{{ devbox_user }}/.local/share"
      mode: "0755"
    - path: "/home/{{ devbox_user }}/.local/state"
      mode: "0755"
    - path: "/home/{{ devbox_user }}/.local/state/dev-server"
      mode: "0700"
    - path: "/home/{{ devbox_user }}/.local/state/dev-server/active"
      mode: "0700"
    - path: "/home/{{ devbox_user }}/.config"
      mode: "0755"
    - path: "/home/{{ devbox_user }}/.ssh"
      mode: "0700"
    - path: "/home/{{ devbox_user }}/.codex-work"
      mode: "0700"
    - path: "/home/{{ devbox_user }}/.codex-work2"
      mode: "0700"
    - path: "/home/{{ devbox_user }}/.claude-work"
      mode: "0700"
