---
- name: Install canonical AI commands and explicit profiles
  ansible.builtin.shell: |
    set -euo pipefail
    dev_server_home_dir={{ ('/home/' ~ devbox_user) | quote }}
    dev_server_assets_root={{ ('/home/' ~ devbox_user ~ '/.local/share/dev-server/assets') | quote }}
    source {{ ('/home/' ~ devbox_user ~ '/.local/share/dev-server/lib/common.sh') | quote }}
    source {{ ('/home/' ~ devbox_user ~ '/.local/share/dev-server/lib/ai-tools.sh') | quote }}
    dev_server_result_jsonl={{ devbox_result_file.path | quote }}
    before_pending=$((dev_server_result_actions + dev_server_result_deferrals))
    if ai_install; then :; else
      rc=$?
      if ((rc == 2 && dev_server_result_actions + dev_server_result_deferrals == before_pending)); then
        render_result ACTION 'AI tools' 'installation requires attention'
      fi
      exit "$rc"
    fi
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ devbox_user }}"
  environment:
    HOME: "/home/{{ devbox_user }}"
    PATH: "/home/{{ devbox_user }}/bin:/home/{{ devbox_user }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  register: ai_tools_apply
  changed_when: >-
    ai_tools_apply.stdout is regex('(?m)^(INSTALLED|UPDATED|CHANGED)  ')
  failed_when: ai_tools_apply.rc not in [0, 2]
