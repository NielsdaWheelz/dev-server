---
- name: Inspect devbox GitHub identity paths
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "/home/{{ devbox_user }}/.ssh/id_ed25519_github"
    - "/home/{{ devbox_user }}/.ssh/id_ed25519_github.pub"
  register: ai_tools_github_identity_paths

- name: Validate devbox GitHub identity topology
  ansible.builtin.assert:
    that:
      - >-
        not (ai_tools_github_identity_paths.results[0].stat.islnk |
             default(false))
      - >-
        not (ai_tools_github_identity_paths.results[1].stat.islnk |
             default(false))
      - >-
        ai_tools_github_identity_paths.results[0].stat.exists ==
        ai_tools_github_identity_paths.results[1].stat.exists
      - >-
        not ai_tools_github_identity_paths.results[0].stat.exists or
        (ai_tools_github_identity_paths.results[0].stat.isreg and
         ai_tools_github_identity_paths.results[0].stat.mode == "0600")
      - >-
        not ai_tools_github_identity_paths.results[1].stat.exists or
        (ai_tools_github_identity_paths.results[1].stat.isreg and
         ai_tools_github_identity_paths.results[1].stat.mode == "0644")
    fail_msg: Invalid devbox GitHub identity topology

- name: Validate existing devbox GitHub identity material
  ansible.builtin.shell: |
    set -euo pipefail
    derived="$(ssh-keygen -y -f /home/{{ devbox_user }}/.ssh/id_ed25519_github)"
    observed="$(awk 'NF >= 2 { print $1 " " $2; exit }' /home/{{ devbox_user }}/.ssh/id_ed25519_github.pub)"
    [[ "$derived" == "$observed" ]]
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ devbox_user }}"
  changed_when: false
  when: ai_tools_github_identity_paths.results[0].stat.exists

- name: Inspect managed GitHub SSH client policy path
  ansible.builtin.stat:
    path: "/home/{{ devbox_user }}/.ssh/config"
    follow: false
  register: ai_tools_github_ssh_config

- name: Validate managed GitHub SSH client policy path
  ansible.builtin.assert:
    that:
      - not (ai_tools_github_ssh_config.stat.islnk | default(false))
      - >-
        not ai_tools_github_ssh_config.stat.exists or
        ai_tools_github_ssh_config.stat.isreg
    fail_msg: Invalid managed GitHub SSH client policy path

- name: Install locked AI commands and explicit profiles
  ansible.builtin.shell: |
    set -euo pipefail
    dev_server_home_dir="/home/{{ devbox_user }}"
    dev_server_assets_root="/home/{{ devbox_user }}/.local/share/dev-server/assets"
    source "/home/{{ devbox_user }}/.local/share/dev-server/lib/common.sh"
    source "/home/{{ devbox_user }}/.local/share/dev-server/lib/ai-tools.sh"
    ai_install
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ devbox_user }}"
  environment:
    HOME: "/home/{{ devbox_user }}"
    PATH: "/home/{{ devbox_user }}/bin:/home/{{ devbox_user }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
  register: ai_tools_apply
  changed_when: >-
    ai_tools_apply.stdout is regex('(?m)^(INSTALLED|UPDATED|CHANGED)  ')

- name: Install exact GitHub SSH client policy
  ansible.builtin.copy:
    dest: "/home/{{ devbox_user }}/.ssh/config"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0600"
    validate: "/usr/bin/ssh -G -F %s github.com"
    content: |
      Host github.com
        HostName github.com
        User git
        IdentityFile ~/.ssh/id_ed25519_github
        IdentitiesOnly yes
        AddKeysToAgent no
        StrictHostKeyChecking accept-new
