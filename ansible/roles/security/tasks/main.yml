---
- name: Ensure root-owned activation state directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    follow: false
    owner: root
    group: root
    mode: "0700"
  loop:
    - /var/lib/dev-server
    - /var/lib/dev-server/active

- name: Inspect recorded active SSH input identity
  ansible.builtin.stat:
    path: /var/lib/dev-server/active/ssh.sha256
    follow: false
  register: security_ssh_active_identity

- name: Validate recorded active SSH input identity path
  ansible.builtin.assert:
    that:
      - not (security_ssh_active_identity.stat.islnk | default(false))
      - >-
        not security_ssh_active_identity.stat.exists or
        security_ssh_active_identity.stat.isreg
      - >-
        not security_ssh_active_identity.stat.exists or
        security_ssh_active_identity.stat.mode == "0600"
      - >-
        not security_ssh_active_identity.stat.exists or
        security_ssh_active_identity.stat.uid == 0
    fail_msg: Invalid recorded active SSH input identity

- name: Read recorded active SSH input identity
  ansible.builtin.slurp:
    path: /var/lib/dev-server/active/ssh.sha256
  register: security_ssh_active_identity_content
  when: security_ssh_active_identity.stat.exists

- name: Validate recorded active SSH input identity value
  ansible.builtin.assert:
    that:
      - (security_ssh_active_identity_content.content | b64decode | length) == 65
      - >-
        (security_ssh_active_identity_content.content | b64decode)
        is match('^[0-9a-f]{64}\n\Z')
    fail_msg: Invalid recorded active SSH input identity
  when: security_ssh_active_identity.stat.exists

- name: Read the declared shared socket principals
  ansible.builtin.set_fact:
    security_codex_config: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../assets/codex/profiles.json') | from_json }}"

- name: Create the dedicated shared Codex client group
  ansible.builtin.group:
    name: "{{ security_codex_config.client_group }}"
    system: true
    state: present

- name: Validate the existing shared socket access boundary
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import grp, pwd, sys
        group = grp.getgrnam(sys.argv[1])
        members = set(group.gr_mem) | {
            user.pw_name for user in pwd.getpwall() if user.pw_gid == group.gr_gid
        }
        unexpected = members - set(sys.argv[2:])
        if unexpected:
            raise SystemExit('unexpected shared socket principals: ' + ', '.join(sorted(unexpected)))
      - "{{ security_codex_config.client_group }}"
      - "{{ security_codex_config.development_user }}"
      - "{{ security_codex_config.jarvis_user }}"
  changed_when: false

- name: Ensure the deployment principal exists
  ansible.builtin.user:
    name: "{{ devbox_deploy_user }}"
    shell: /bin/bash
    groups: sudo
    append: false
    create_home: true

- name: Keep only the declared operator socket-access group
  ansible.builtin.user:
    name: "{{ devbox_user }}"
    groups: "{{ security_codex_config.client_group }}"
    append: false

- name: Grant Jarvis shared socket access without changing application groups
  ansible.builtin.user:
    name: "{{ security_codex_config.jarvis_user }}"
    groups: "{{ security_codex_config.client_group }}"
    append: true

- name: Install deployment-only elevation policy
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ devbox_deploy_user }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
    content: "{{ devbox_deploy_user }} ALL=(ALL:ALL) NOPASSWD:ALL\n"

- name: Remove operator elevation policy
  ansible.builtin.file:
    path: "/etc/sudoers.d/90-devbox-{{ devbox_user }}"
    state: absent

- name: Install SSH daemon policy
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-devbox.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      PermitRootLogin no
      X11Forwarding no
      AllowUsers {{ devbox_user }} {{ devbox_deploy_user }}

- name: Read desired SSH input identity
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d/99-devbox.conf
    checksum_algorithm: sha256
  register: security_ssh_config_identity

- name: Resolve SSH activation identities
  ansible.builtin.set_fact:
    security_ssh_desired_identity: "{{ security_ssh_config_identity.stat.checksum }}"
    security_ssh_active_identity_value: >-
      {{ (security_ssh_active_identity_content.content | b64decode | trim)
         if security_ssh_active_identity.stat.exists else '' }}

- name: Ensure SSH is enabled and active
  ansible.builtin.systemd_service:
    name: ssh.service
    enabled: true
    state: started

- name: Schedule required SSH configuration activation
  ansible.builtin.debug:
    msg: Activating changed SSH inputs
  changed_when: true
  notify: Reload SSH safely
  when: security_ssh_desired_identity != security_ssh_active_identity_value

- name: Reconcile the exact UFW ingress boundary
  ansible.builtin.shell: |
    python3 - <<'PY'
    import shlex
    import subprocess

    def ufw(*args):
        return subprocess.run(
            ["ufw", *args], check=True, text=True, stdout=subprocess.PIPE
        ).stdout

    def rules():
        return [shlex.split(line)[1:] for line in ufw("show", "added").splitlines()
                if line.startswith("ufw ")]

    def public_ingress(rule):
        if rule[0] not in ("allow", "limit") or rule[1:2] == ["out"]:
            return False
        target = rule[2:] if rule[1:2] == ["in"] else rule[1:]
        return target[:2] != ["on", "tailscale0"]

    before = ufw("status", "verbose")
    active = "Status: active" in before
    changed = False
    if not active:
        ufw("--force", "reset")
        changed = True

    declared = rules()
    for rule in declared:
        if public_ingress(rule):
            ufw("--force", "delete", *rule)
            changed = True

    defaults = "Default: deny (incoming), allow (outgoing)"
    if defaults not in before:
        ufw("default", "deny", "incoming")
        ufw("default", "allow", "outgoing")
        changed = True
    tailnet = ["allow", "in", "on", "tailscale0"]
    if tailnet not in declared:
        ufw(*tailnet)
        changed = True
    if not active:
        ufw("--force", "enable")
        changed = True

    after = ufw("status", "verbose")
    if "Status: active" not in after or defaults not in after:
        raise SystemExit("UFW is not active with the declared default policies")
    if any(public_ingress(rule) for rule in rules()):
        raise SystemExit("non-tailnet inbound acceptance remains in UFW")
    if changed:
        print("DEV_SERVER_UFW_CHANGED=1")
    PY
  args:
    executable: /bin/bash
  register: security_ufw_apply
  changed_when: "'DEV_SERVER_UFW_CHANGED=1' in security_ufw_apply.stdout"
