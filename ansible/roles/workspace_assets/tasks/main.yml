---
- name: Ensure remote dev-server directories exist
  ansible.builtin.file:
    path: "/home/{{ devbox_user }}/.local/share/dev-server/{{ item }}"
    state: directory
    follow: false
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0755"
  loop:
    - ""
    - lib
    - assets
    - assets/dotfiles
    - assets/routers
    - assets/claude
    - assets/skid-provider
    - assets/memory

- name: Install exact runtime libraries
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../lib/{{ item }}"
    dest: "/home/{{ devbox_user }}/.local/share/dev-server/lib/{{ item }}"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0644"
  loop:
    - common.sh
    - tmux.sh
    - dotfiles.sh
    - ai-tools.sh
    - memory.sh

- name: Install exact dotfile assets
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../assets/dotfiles/{{ item }}"
    dest: "/home/{{ devbox_user }}/.local/share/dev-server/assets/dotfiles/{{ item }}"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0644"
  loop:
    - gitconfig
    - gitignore_global
    - p10k.zsh
    - tmux.conf
    - zsh_helpers
    - zshenv
    - zshrc

- name: Install explicit AI profile wrapper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../assets/routers/ai-profile"
    dest: "/home/{{ devbox_user }}/.local/share/dev-server/assets/routers/ai-profile"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0755"

- name: Install exact claude status line script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../assets/claude/statusline.sh"
    dest: "/home/{{ devbox_user }}/.local/share/dev-server/assets/claude/statusline.sh"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0755"

- name: Install shared AI instructions
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../assets/agent-instructions.md"
    dest: "/home/{{ devbox_user }}/.local/share/dev-server/assets/agent-instructions.md"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0600"

- name: Install skid native-control declaration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../assets/skid-provider/native-control.json"
    dest: "/home/{{ devbox_user }}/.local/share/dev-server/assets/skid-provider/native-control.json"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0644"

- name: Install the declared memory deployment assets
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../assets/memory/"
    dest: "/home/{{ devbox_user }}/.local/share/dev-server/assets/memory/"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: preserve
