---
- name: Ensure remote dev-server directories exist
  ansible.builtin.file:
    path: "/home/{{ devbox_user }}/.local/share/dev-server/{{ item }}"
    state: directory
    follow: false
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0755"
  loop:
    - ""
    - lib
    - assets
    - assets/dotfiles
    - assets/routers
    - assets/codex
    - assets/claude
    - assets/herdr

- name: Install exact runtime libraries
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../lib/{{ item }}"
    dest: "/home/{{ devbox_user }}/.local/share/dev-server/lib/{{ item }}"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0644"
  loop:
    - common.sh
    - tmux.sh
    - dotfiles.sh
    - ai-tools.sh
    - herdr.sh

- name: Install exact dotfile assets
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../assets/dotfiles/{{ item }}"
    dest: "/home/{{ devbox_user }}/.local/share/dev-server/assets/dotfiles/{{ item }}"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0644"
  loop:
    - gitconfig
    - gitignore_global
    - p10k.zsh
    - tmux.conf
    - zsh_helpers
    - zshenv
    - zshrc

- name: Install explicit AI profile wrapper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../assets/routers/ai-profile"
    dest: "/home/{{ devbox_user }}/.local/share/dev-server/assets/routers/ai-profile"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0755"

- name: Install exact claude status line script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../assets/claude/statusline.sh"
    dest: "/home/{{ devbox_user }}/.local/share/dev-server/assets/claude/statusline.sh"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0755"

- name: Install exact shared Codex installer inputs
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../assets/codex/{{ item }}"
    dest: "/home/{{ devbox_user }}/.local/share/dev-server/assets/codex/{{ item }}"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0644"
  loop:
    - profiles.json
    - codex-shared.py

- name: Install shared AI instructions
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../assets/agent-instructions.md"
    dest: "/home/{{ devbox_user }}/.local/share/dev-server/assets/agent-instructions.md"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0600"

- name: Install exact herdr installer inputs
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../assets/herdr/{{ item }}"
    dest: "/home/{{ devbox_user }}/.local/share/dev-server/assets/herdr/{{ item }}"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0644"
  loop:
    - release-pin.json
    - config.toml
    - herdr.service
    - herdr-gate
    - jarvis-gate.pub
