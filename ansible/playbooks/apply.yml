---
- name: Apply devbox state
  hosts: devbox
  gather_facts: true
  become: true
  vars_files:
    - ../group_vars/devbox.yml
  pre_tasks:
    - name: Validate the exact Ubuntu devbox target
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_release'] == 'noble'
          - ansible_facts['architecture'] == 'x86_64'
          - ansible_facts['hostname'] == 'dev-server'
        fail_msg: Refusing to apply outside the exact Ubuntu devbox target

    - name: Validate all existing remote managed state before mutation
      ansible.builtin.import_tasks: tasks/remote-preflight.yml

    - name: Admit or drain the coupled shared Codex runtime before mutation
      ansible.builtin.import_tasks: tasks/codex-runtime-preflight.yml
  roles:
    - role: base
    - role: jarvis_host
    - role: workspace_assets
    - role: security
    - role: shell
    - role: ai_tools
    - role: codex_shared
    - role: skidbladnir
    - role: rootless_docker
  post_tasks:
    - name: Activate and verify the coupled shared Codex runtime
      ansible.builtin.import_tasks: tasks/codex-runtime-activate.yml

    - name: Activate notified consumers before verification
      ansible.builtin.meta: flush_handlers

    - name: Validate active SSH configuration
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: Verify the host firewall boundary
      ansible.builtin.shell: |
        set -euo pipefail
        status="$(ufw status verbose)"
        grep -Fq 'Status: active' <<<"$status"
        grep -Eq '^Default: deny \(incoming\)' <<<"$status"
        while IFS= read -r rule; do
          [[ "$rule" == *'ALLOW IN'* ]] || continue
          target="${rule%%ALLOW IN*}"
          [[ "$target" != *'on tailscale0'* ]] || continue
          printf 'non-tailnet inbound allow remains in UFW: %s\n' "$rule" >&2
          exit 1
        done <<<"$status"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Read the applied host timezone
      ansible.builtin.command: timedatectl show -p Timezone --value
      register: devbox_timezone_after
      changed_when: false
      failed_when: devbox_timezone_after.stdout != 'UTC'

    - name: Read the applied PostgreSQL boundary
      ansible.builtin.command:
        argv:
          - psql
          - -Atd
          - postgres
          - -c
          - "SELECT current_setting('TimeZone') || '|' || current_setting('listen_addresses')"
      become: true
      become_user: postgres
      register: devbox_postgresql_boundary
      changed_when: false
      failed_when: devbox_postgresql_boundary.stdout != 'UTC|localhost'

    - name: Validate the Jarvis host directory boundary
      ansible.builtin.shell: |
        set -euo pipefail
        account="$(getent passwd jarvis)"
        IFS=: read -r name _ uid gid _ home shell <<<"$account"
        [[ "$name" == jarvis ]]
        [[ "$uid" != 0 && "$gid" != 0 ]]
        [[ "$home" == /var/lib/jarvis ]]
        [[ "$shell" == /usr/sbin/nologin ]]
        [[ "$(stat -c '%U|%G|%a' /opt/jarvis)" == 'root|root|755' ]]
        [[ "$(stat -c '%U|%G|%a' /opt/jarvis/releases)" == 'root|root|755' ]]
        [[ "$(stat -c '%U|%G|%a' /var/lib/jarvis)" == 'jarvis|jarvis|700' ]]
        [[ "$(stat -c '%U|%G|%a' /etc/jarvis)" == 'root|jarvis|750' ]]
      args:
        executable: /bin/bash
      changed_when: false

    - name: Inspect pending reboot state
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: devbox_reboot_required

    - name: Report deferred reboot
      ansible.builtin.debug:
        msg: DEV_SERVER_REBOOT_DEFERRED
      when: devbox_reboot_required.stat.exists
