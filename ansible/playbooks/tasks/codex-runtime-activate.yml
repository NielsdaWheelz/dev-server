---
- name: Reload systemd after installing shared Codex units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: codex_runtime_needs_activation

- name: Enable and start the three shared Codex services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - codex-shared@personal.service
    - codex-shared@work.service
    - codex-shared@work2.service


- name: Validate the installed shared Codex declaration and helper
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/codex-shared
      - validate
  changed_when: false

- name: Verify every shared Codex consumer is active
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - --quiet
      - "{{ item }}"
  loop:
    - codex-shared@personal.service
    - codex-shared@work.service
    - codex-shared@work2.service
  changed_when: false

- name: Verify the three shared Codex sockets accept connections
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/codex-shared
      - verify-socket
      - "{{ item.key }}"
  loop: "{{ codex_shared_config.profiles | dict2items }}"
  changed_when: false

- name: Record the active shared Codex identity
  ansible.builtin.copy:
    dest: /var/lib/dev-server/active/codex.runtime.sha256
    owner: root
    group: root
    mode: "0600"
    content: "{{ codex_runtime_desired_identity }}\n"
