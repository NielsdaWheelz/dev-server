---
- name: Maintain standalone skid on the personal devbox
  hosts: devbox
  gather_facts: true
  become: true
  vars_files:
    - ../group_vars/devbox.yml
  pre_tasks:
    - name: Validate the exact Ubuntu devbox and selected operation
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_release'] == 'noble'
          - ansible_facts['architecture'] == 'x86_64'
          - ansible_facts['hostname'] == 'dev-server'
          - gateway_product == 'skidbladnir'
          - gateway_operation in ['apply', 'remove']
    - name: Read the host user id
      ansible.builtin.command: "id -u {{ devbox_user }}"
      register: skid_user_uid
      changed_when: false
  tasks:
    - name: Create personal provisioner input directories
      ansible.builtin.file:
        path: "/home/{{ devbox_user }}/.local/share/dev-server/{{ item }}"
        state: directory
        owner: "{{ devbox_user }}"
        group: "{{ devbox_user }}"
        mode: '0755'
      loop: ['', 'lib', 'assets', 'assets/skidbladnir']

    - name: Install standalone consumer libraries
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../lib/{{ item }}"
        dest: "/home/{{ devbox_user }}/.local/share/dev-server/lib/{{ item }}"
        owner: "{{ devbox_user }}"
        group: "{{ devbox_user }}"
        mode: '0644'
      loop: [common.sh, skidbladnir.sh]

    - name: Install personal release pin and authoritative desired yaml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../assets/skidbladnir/"
        dest: "/home/{{ devbox_user }}/.local/share/dev-server/assets/skidbladnir/"
        owner: "{{ devbox_user }}"
        group: "{{ devbox_user }}"
        mode: preserve

    - name: Invoke ordinary skid installation or removal
      ansible.builtin.shell: |
        set -euo pipefail
        dev_server_home_dir="/home/{{ devbox_user }}"
        dev_server_assets_root="$dev_server_home_dir/.local/share/dev-server/assets"
        source "$dev_server_assets_root/../lib/common.sh"
        source "$dev_server_assets_root/../lib/skidbladnir.sh"
        skidbladnir_{{ gateway_operation }} devbox
        finish_results devbox
      args:
        executable: /bin/bash
      become_user: "{{ devbox_user }}"
      environment:
        HOME: "/home/{{ devbox_user }}"
        PATH: "/home/{{ devbox_user }}/bin:/home/{{ devbox_user }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
        XDG_RUNTIME_DIR: "/run/user/{{ skid_user_uid.stdout }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ skid_user_uid.stdout }}/bus"
      register: skid_result
      changed_when: skid_result.stdout is regex('(?m)^(INSTALLED|UPDATED|CHANGED|installed) ')
      failed_when: >-
        skid_result.rc not in [0, 2] or
        (skid_result.rc == 2 and not (skid_result.stdout is regex('(?m)^ACTION  ')))

    - name: Report standalone skid actions
      ansible.builtin.debug:
        msg: "{{ item }}"
      loop: "{{ skid_result.stdout_lines | select('match', '^(ACTION|INSTALLED|UPDATED|CHANGED|STARTED|RESTARTED)  ') | list }}"
