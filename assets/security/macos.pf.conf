# private workstation ingress; tailscale policy remains the fleet authority.
table <dev_server_local> const { 100.74.175.11, fd7a:115c:a1e0::3138:af0b }
table <dev_server_operators> const { 100.106.186.126, fd7a:115c:a1e0::3438:ba7f }
table <dev_server_skid> const { 100.74.175.11, fd7a:115c:a1e0::3138:af0b, 100.106.186.126, fd7a:115c:a1e0::3438:ba7f, 100.109.88.95, fd7a:115c:a1e0::9e38:585f, 100.68.99.68, fd7a:115c:a1e0::2b01:6365 }
# bedroom tv; update these addresses if its network configuration changes.
table <dev_server_airplay> const { 10.0.0.128, fe80::b7be:f7eb:ce69:e1fd, 2601:645:8104:6400:2931:3135:8b83:f4fa }

pass quick on lo0 all
# flags any lets the next outgoing packet seed an already-open tcp flow.
pass out proto tcp all flags any keep state
pass out all keep state

# a physical-interface packet cannot impersonate an approved overlay source.
block in quick from urpf-failed to <dev_server_local>
pass in quick proto tcp from <dev_server_operators> to <dev_server_local> port 22 flags S/SA keep state
pass in quick proto tcp from <dev_server_skid> to <dev_server_local> port 8443 flags S/SA keep state

# bonjour replies to multicast queries do not match outbound connection state.
pass in quick on en0 inet proto udp from (en0:network) port 5353 to { 224.0.0.251, (en0) } port 5353
pass in quick on en0 inet6 proto udp from { (en0:network), fe80::/10 } port 5353 to { ff02::fb, (en0), fe80::/10 } port 5353
# airplay negotiates udp timing/media ports; trust only this receiver on wi-fi.
# pf's interface shortcuts omit link-local ipv6 addresses.
pass in quick on en0 proto udp from <dev_server_airplay> to { (en0), fe80::/10 }

pass in quick inet proto udp from any port 67 to any port 68
pass in quick inet6 proto udp from fe80::/10 port 547 to any port 546
pass in quick inet6 proto ipv6-icmp icmp6-type { unreach, toobig, timex, paramprob, routersol, routeradv, neighbrsol, neighbradv }
block in quick all
