Section "InputClass"
    Identifier "dev-server Huawei MACH-WX9 touchpad"
    MatchIsTouchpad "on"
    MatchProduct "SYNA1D31:00 06CB:CD48 Touchpad"
    Driver "libinput"

    # Preserve libinput's precise low-speed response, then smoothly stretch its
    # adaptive ramp from about 0.88x to 20x for fast motion. Scrolling stays linear.
    Option "AccelProfile" "custom"
    Option "AccelPointsFallback" "0.0 1.0"
    Option "AccelStepFallback" "1.0"
    Option "AccelPointsMotion" "0.000000 0.042000 0.184013 0.276020 0.368026 0.460033 0.552039 0.644046 0.736052 0.828059 0.920065 1.012072 1.104078 1.196085 1.288091 1.404095 1.693418 2.032974 2.427308 2.880968 3.398501 3.984455 4.643376 5.379811 6.198308 7.103414 8.099676 9.191641 10.383856 11.680868 13.087225 14.607473 16.246161 18.007833 19.897038 21.918324 24.076237 26.375324 28.820133 31.415211 34.165104 37.074360 40.147526 43.389149 46.803776 50.395954 54.170231 58.131153 62.283268 66.631126 71.179268 75.932243 80.894600 86.070885 91.465645 97.083435 102.928787 109.006256 115.320396 121.875740 126.000000 128.100006 130.199997 132.300003"
    Option "AccelStepMotion" "0.105"
    Option "AccelPointsScroll" "0.0 1.0"
    Option "AccelStepScroll" "1.0"
    Option "ClickMethod" "clickfinger"
    Option "DisableWhileTyping" "on"
    Option "HorizontalScrolling" "on"
    Option "NaturalScrolling" "on"
    Option "ScrollMethod" "twofinger"
    Option "ScrollPixelDistance" "15"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    Option "TappingDrag" "on"
    Option "TappingDragLock" "off"
EndSection
