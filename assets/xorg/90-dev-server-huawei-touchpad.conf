Section "InputClass"
    Identifier "dev-server Huawei MACH-WX9 touchpad"
    MatchIsTouchpad "on"
    MatchProduct "SYNA1D31:00 06CB:CD48 Touchpad"
    Driver "libinput"

    # Motion gain is about 1.0x at low speed, 8.0x at medium speed, 9.0x at
    # moderately fast speed, and 15.0x for fast swipes. Scrolling stays linear.
    Option "AccelProfile" "custom"
    Option "AccelPointsFallback" "0.0 1.0"
    Option "AccelStepFallback" "1.0"
    Option "AccelPointsMotion" "0.0 1.0 9.0 24.0 34.0 45.0 61.2 79.8 100.8 124.2 150.0"
    Option "AccelStepMotion" "1.0"
    Option "AccelPointsScroll" "0.0 1.0"
    Option "AccelStepScroll" "1.0"
    Option "ClickMethod" "clickfinger"
    Option "DisableWhileTyping" "on"
    Option "HorizontalScrolling" "on"
    Option "NaturalScrolling" "on"
    Option "ScrollMethod" "twofinger"
    Option "ScrollPixelDistance" "15"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    Option "TappingDrag" "on"
    Option "TappingDragLock" "off"
EndSection
