#cloud-config
hostname: __SERVER_NAME__
timezone: America/Los_Angeles
package_update: false
package_upgrade: false
ssh_pwauth: false
disable_root: true

users:
  - name: __SERVER_USER__
    gecos: Devbox User
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - __OPERATOR_PUBLIC_KEY__
  - name: __DEPLOY_USER__
    gecos: Devbox Deployment Principal
    shell: /bin/bash
    lock_passwd: true
    groups: [sudo]
    ssh_authorized_keys:
      - __DEPLOY_PUBLIC_KEY__

write_files:
  - path: /etc/sudoers.d/90-__DEPLOY_USER__
    owner: root:root
    permissions: "0440"
    content: |
      __DEPLOY_USER__ ALL=(ALL:ALL) NOPASSWD:ALL
  - path: /etc/ssh/sshd_config.d/99-devbox.conf
    owner: root:root
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      PermitRootLogin no
      X11Forwarding no
      AllowUsers __SERVER_USER__ __DEPLOY_USER__
  - path: /root/.devbox-tailscale-auth-key
    owner: root:root
    permissions: "0600"
    encoding: b64
    content: "__TAILSCALE_AUTH_KEY_B64__"
  - path: /usr/local/sbin/devbox-bootstrap
    owner: root:root
    permissions: "0700"
    content: |
      #!/usr/bin/env bash
      set -euxo pipefail
      export DEBIAN_FRONTEND=noninteractive
      bootstrap_cidr="__BOOTSTRAP_SSH_CIDR__"

      cleanup() {
        set +e
        if command -v ufw >/dev/null 2>&1; then
          ufw --force delete allow from "$bootstrap_cidr" to any port 22 proto tcp >/dev/null 2>&1 || true
        fi
        rm -f \
          /root/.devbox-tailscale-auth-key \
          /usr/local/sbin/devbox-bootstrap \
          /var/lib/cloud/instance/cloud-config.txt \
          /var/lib/cloud/instance/user-data.txt \
          /var/lib/cloud/instance/user-data.txt.i
      }
      trap cleanup EXIT

      apt-get update
      apt-get install -y --no-install-recommends \
        ca-certificates \
        curl \
        gnupg \
        openssh-server \
        python3 \
        python3-apt \
        sudo \
        ufw

      install -d -m 0755 /usr/share/keyrings
      curl -fsSL \
        https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg \
        -o /usr/share/keyrings/tailscale-archive-keyring.gpg
      curl -fsSL \
        https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list \
        -o /etc/apt/sources.list.d/tailscale.list
      apt-get update
      apt-get install -y --no-install-recommends tailscale

      sshd -t
      systemctl reload ssh
      ufw default deny incoming
      ufw default allow outgoing
      ufw allow from "$bootstrap_cidr" to any port 22 proto tcp
      ufw allow in on tailscale0
      ufw --force enable

      systemctl enable --now tailscaled
      tailscale up \
        --auth-key=file:/root/.devbox-tailscale-auth-key \
        --hostname=__SERVER_NAME__ \
        --operator=__SERVER_USER__

runcmd:
  - /usr/local/sbin/devbox-bootstrap
